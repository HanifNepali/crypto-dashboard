<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var stored = localStorage.getItem('coingecko-dashboard-theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://api.coingecko.com" />
    <link rel="dns-prefetch" href="https://api.coingecko.com" />
    <link rel="preconnect" href="https://coin-images.coingecko.com" />
    <link rel="dns-prefetch" href="https://coin-images.coingecko.com" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoinGecko - Live Market Data</title>
    <meta
      name="description"
      content="Real-time cryptocurrency market dashboard: prices, market cap, trending coins, and price charts."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
